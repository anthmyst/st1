name: daily-take-away-english

on:
  schedule:
    # UTC 周日 17:00 = 北京时间周一 01:00，每周自动抓取一次
    - cron: "0 17 * * 0"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步远端最新
        # data 由脚本每次重新生成（幂等），所以直接以远端为准，
        # 避免本地落后导致后续 rebase 冲突、把冲突标记写进数据
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 抓取最新一期与官方 PDF
        # 首跑拉满最近 60 期做归档；之后已归档的会自动跳过，每天只补新的一期
        run: python3 fetch_daily.py --all 60

      - name: 有更新才提交
        id: diff
        continue-on-error: true   # 推送被拒(本地落后于远端)时不影响后续部署
        run: |
          git config user.name  "tae-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data)" ]]; then
            git add data
            git commit -m "weekly update: $(date -u +%F) 最新一期"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "今天没有新内容"
          fi

      - name: 校验数据（有冲突标记或损坏就中止，不部署脏数据）
        run: |
          if grep -rl '<<<<<<<' data/; then
            echo "data 残留 Git 冲突标记，中止部署"
            exit 1
          fi
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob('data/**/*.json', recursive=True):
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('\n'.join(bad[:10]))
              sys.exit(1)
          print('数据校验通过')
          PY

      - name: 组装 Pages 站点
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.webmanifest _site/
          cp sw.js _site/
          cp -r data _site/data
          cp -r icons _site/icons
          cp README.md _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
